site_name: OpenPDAC-14
site_description: Documentation for the OpenPDAC multiphase solver based on OpenFOAM 14
site_author: Mattia de' Michieli Vitturi
site_url: https://demichie.github.io/OpenPDAC-14/
repo_url: https://github.com/demichie/OpenPDAC-14
repo_name: demichie/OpenPDAC-14
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: assets/images/openpdac-mark.svg
  favicon: assets/images/openpdac-mark.svg
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono

nav:
  - Home: index.md
  - Getting started:
      - Overview: getting-started/index.md
      - Installation: getting-started/installation.md
      - Running a tutorial: getting-started/running.md
  - Model:
      - Eulerian and Lagrangian phases: model/phases.md
      - Hydrostatic initialization: model/hydrostatic.md
      - AMR and load balancing: model/amr.md
  - Utilities:
      - topoGrid: utilities/topogrid.md
  - Tutorials: tutorials/index.md
  - Development:
      - Repository and build: development/index.md
      - Testing and CI: development/testing.md
  - References:
      - Citation and license: references/index.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/demichie/OpenPDAC-14
      name: OpenPDAC on GitHub
  generator: false

copyright: Copyright &copy; Mattia de' Michieli Vitturi — INGV, Sezione di Pisa

